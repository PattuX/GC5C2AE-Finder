<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GC5C2AE Finder</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  </head>
  <body>
    <main class="container">
      <h1>GC5C2AE Finder</h1>
      <p>Upload one or more <code>.loc</code> / <code>.gpx</code> files to process them without coding.</p>

      <label class="upload">
        <span>Select files</span>
        <input id="fileInput" type="file" accept=".loc,.gpx" multiple />
      </label>

      <div class="actions">
        <button id="runButton">Run Finder</button>
        <button id="downloadButton" disabled>Download .loc ZIP</button>
      </div>

      <div id="output" class="terminal">Ready.</div>
    </main>

    <script type="module" src="web.js"></script>
  </body>
</html>

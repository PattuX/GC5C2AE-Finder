<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GC5C2AE Finder</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
  </head>
  <body>
    <main class="container">
      <h1>GC5C2AE Finder</h1>
      <p>Upload one or more <code>.loc</code> / <code>.gpx</code> files and run <code>gs.py</code> in your browser.</p>

      <label class="upload">
        <span>Select files</span>
        <input id="fileInput" type="file" accept=".loc,.gpx" multiple />
      </label>

      <button id="runButton">Run Finder</button>

      <section>
        <h2>Terminal Output</h2>
        <pre id="output">Ready.</pre>
      </section>
    </main>

    <script type="module" src="web.js"></script>
  </body>
</html>
